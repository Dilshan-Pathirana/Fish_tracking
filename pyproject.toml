[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-tracker"
version = "1.0.0"
description = "A lightweight, open-source tool for tracking single aquatic animals in laboratory videos and quantifying their movement and space use."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Dilshan Pathirana", email = "dilshan.pathirana.121@gmail.com"},
]
keywords = [
    "animal tracking",
    "computer vision",
    "behavioral ecology",
    "video analysis",
    "aquatic animals",
    "laboratory research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.20.0",
    "opencv-contrib-python>=4.8.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "black>=23.0",
    "flake8>=6.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=1.20",
]

[project.urls]
Homepage = "https://github.com/Dilshan-Pathirana/Fish_tracking"
Documentation = "https://github.com/Dilshan-Pathirana/Fish_tracking"
Repository = "https://github.com/Dilshan-Pathirana/Fish_tracking.git"
"Bug Tracker" = "https://github.com/Dilshan-Pathirana/Fish_tracking/issues"

[project.scripts]
fish-tracker-gui = "main:main"
fish-tracker-batch = "No_GUI:main"
fish-tracker-debug = "single_run:main"

[tool.setuptools]
packages = ["utils"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=utils --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["utils", "."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

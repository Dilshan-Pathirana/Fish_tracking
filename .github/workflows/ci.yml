name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run type checking with mypy
        run: |
          mypy . --ignore-missing-imports --no-error-summary || true

      - name: Check code style with black
        run: |
          black --check . || true

      - name: Check linting with flake8
        run: |
          flake8 . --max-line-length=100 --ignore=E203,E501,W503 || true

      - name: Run tests
        run: |
          pytest tests/ --cov=utils --cov-report=term-missing --cov-report=html

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name FishTracker main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishTracker-exe
          path: dist/FishTracker.exe
